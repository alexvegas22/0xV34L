<header>
  <div id="nav-border" class="header-container rounded-container">
    <div class="header-content">
      <div>
        <h1 class="site-title">{{ site.Title }}</h1>
      </div>
      <nav id="nav" class="nav-menu">
	{{ $current := .}}
        {{ range .Site.Menus.main }}
        <a class="nav-link" href="{{ .URL }}">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>
    </div>
  </div>
</header>
